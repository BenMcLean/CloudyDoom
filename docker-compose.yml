services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${WEB_HTTP_PORT:-8080}:8080"
    environment:
      DOOM_WS_URL: ${DOOM_WS_URL:?Set DOOM_WS_URL to the externally-reachable websocket URL, e.g. wss://doom.example.com:8081}
      # Shared password only - not DOOM_-prefixed like the vars above,
      # since it's an nginx-only access gate that never reaches doom-wasm
      # or chocolate-server. The username is left up to each client and
      # used as their in-game player name. Optional - leave blank in .env
      # for a public server with nothing to gate. See nginx/auth.js.
      PASSWORD: ${PASSWORD:-}
      # Set to "false" to skip using the login username as the in-game
      # player name (falls back to doom-wasm's own random pet name
      # generator instead). Combined with a blank PASSWORD above, this
      # skips the login prompt entirely - see nginx/auth.js.
      USE_LOGIN_NAME: ${USE_LOGIN_NAME:-true}
      DOOM_IWAD_PATH: ${DOOM_IWAD_PATH:-doom1.wad}
      DOOM_PWAD_PATH: ${DOOM_PWAD_PATH:-}
      DOOM_DEH_PATH: ${DOOM_DEH_PATH:-}
    # Runs as nginx's own built-in user (101:101) by default - matches what
    # nginx.conf's lack of a "user" directive already implies. Override
    # with PUID/PGID if your WAD_DIR is owned by a specific uid/gid on the
    # host, e.g. PUID=1001 PGID=1001 in .env - same convention as the
    # linuxserver.io images.
    user: "${PUID:-101}:${PGID:-101}"
    volumes:
      - ${WAD_DIR:-./wads}:/wads:ro
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    ports:
      - "${GATEWAY_WS_PORT:-8081}:8081"
    environment:
      WS_PORT: 8081
      DOOM_SERVER_HOST: doom-server
      DOOM_SERVER_PORT: ${DOOM_SERVER_PORT:-2342}
    depends_on:
      - doom-server
    restart: unless-stopped

  doom-server:
    build:
      context: ./doom-server
    ports:
      - "${DOOM_SERVER_PORT:-2342}:${DOOM_SERVER_PORT:-2342}/udp"
    environment:
      DOOM_SERVER_PORT: ${DOOM_SERVER_PORT:-2342}
    restart: unless-stopped
