worker_processes auto;

# Logging directly to the stdout/stderr device paths, not the base image's
# default /var/log/nginx/*.log (which are themselves just symlinks to these
# same devices). That indirection breaks when nginx runs as a custom
# PUID/PGID: re-opening /proc/self/fd/N through the symlink hits a
# permission check that using the device path directly doesn't.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # nginx:1.27's bundled mime.types already maps .wasm -> application/wasm.
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/wasm;

    server {
        listen 8080;

        root /usr/share/nginx/html;

        auth_basic           "doom.example.com";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # config.json is regenerated per-container-start from env vars;
        # never let it be cached by the browser.
        location = /config.json {
            add_header Cache-Control "no-store";
        }

        # WAD files live on a mounted volume, separate from the baked-in
        # site assets, so swapping IWADs never touches the image - see
        # DOOM_IWAD_PATH in docker-entrypoint.sh.
        location /wads/ {
            alias /wads/;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
