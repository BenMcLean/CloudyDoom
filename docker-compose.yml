# Defined once, aliased everywhere it's needed below (the published port,
# the container's own listen port, and the DOOM_SERVER_PORT env var
# chocolate-server reads to know what to -port itself) - unlike
# WEB_HTTP_PORT/GATEWAY_WS_PORT, this one genuinely needs to land in three
# places for chocolate-server to work at all, so it's a YAML anchor instead
# of three separate copies of "${DOOM_SERVER_PORT:-2342}" to keep in sync.
# "x-" top-level keys are Compose's own extension-field convention - ignored
# by the engine, purely a place to hang reusable YAML like this.
x-doom-server-port: &doom_server_port "${DOOM_SERVER_PORT:-2342}"

services:
  cloudydoom:
    build: .
    image: ghcr.io/benmclean/cloudydoom:latest
    # Every port below is "host:container" - only the host side (left of the
    # colon, driven by the *_PORT vars below) is meant to change; the
    # container side (right of the colon) is a fixed, container-internal
    # detail nothing outside this container ever addresses directly, so it's
    # never a var here. The dedicated server is the one exception - see the
    # &doom_server_port anchor above and its two aliases below.
    ports:
      - "${WEB_HTTP_PORT:-2344}:2344"
      - "${GATEWAY_WS_PORT:-2343}:2343"
      - target: *doom_server_port
        published: *doom_server_port
        protocol: udp
    environment:
      DOOM_WS_URL: ${DOOM_WS_URL:?Set DOOM_WS_URL to the externally-reachable websocket URL, e.g. wss://doom.example.com (behind a reverse proxy) or wss://doom.example.com:2343 (direct, no proxy)}
      # Shared password only - not DOOM_-prefixed like the vars above,
      # since it's an nginx-only access gate that never reaches doom-wasm
      # or chocolate-server. The username is left up to each client and
      # used as their in-game player name. Optional - leave blank in .env
      # for a public server with nothing to gate. See nginx/auth.js.
      PASSWORD: ${PASSWORD:-}
      # Set to "false" to skip using the login username as the in-game
      # player name (falls back to doom-wasm's own random pet name
      # generator instead). Combined with a blank PASSWORD above, this
      # skips the login prompt entirely - see nginx/auth.js.
      USE_LOGIN_NAME: ${USE_LOGIN_NAME:-true}
      DOOM_IWAD_PATH: ${DOOM_IWAD_PATH:-doom1.wad}
      DOOM_PWAD_PATH: ${DOOM_PWAD_PATH:-}
      DOOM_DEH_PATH: ${DOOM_DEH_PATH:-}
      DOOM_EXTRA_ARGS: ${DOOM_EXTRA_ARGS:-}
      DOOM_SERVER_PORT: *doom_server_port
    # Runs as nginx's own built-in user (101:101) by default - matches what
    # nginx.conf's lack of a "user" directive already implies, and is also
    # what chocolate-server/node run as here since it's one container.
    # Override with PUID/PGID if your WAD_DIR is owned by a specific uid/gid
    # on the host, e.g. PUID=1001 PGID=1001 in .env - same convention as the
    # linuxserver.io images.
    user: "${PUID:-101}:${PGID:-101}"
    volumes:
      - ${WAD_DIR:-./wads}:/wads:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
