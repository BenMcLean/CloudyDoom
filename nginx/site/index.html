<!DOCTYPE html>
<html lang="en-us">
    <head>
        <title>doom.example.com</title>
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <style>
            @font-face {
                font-family: "VT323";
                font-style: normal;
                font-weight: 400;
                src: url(https://fonts.gstatic.com/s/vt323/v12/pxiKyp0ihIEF2isfFJXUdVNF.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }

            * {
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
            }

            html {
                font-family: "VT323", monospace;
                font-size: 12px;
            }

            body {
                background-color: #111;
                color: #ccc;
                margin: 0;
                padding: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            #container {
                position: relative;
                width: 100vw;
                height: 100vh;
                margin: auto;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .frame {
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
            }

            /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
            canvas.frame {
                background-color: black;
                aspect-ratio: 4 / 3;
                width: min(100vw, calc(100vh * 4 / 3));
                height: min(100vh, calc(100vw * 3 / 4));
            }

            /* overlay, not laid out in the flow, so a long/wrapped message can
               never get clipped by the canvas's size budget or body's overflow:hidden */
            #status {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0.5ch;
                max-width: 100vw;
                padding: 0 1ch;
                font-size: 1.4em;
                text-align: center;
                min-height: 1.4em;
                text-shadow: 0 0 4px #000, 0 0 4px #000;
            }
        </style>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
    </head>
    <body>
        <div id="container" class="noselect">
            <canvas class="frame" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
            <div id="status">Loading configuration&hellip;</div>
        </div>
        <script src="app.js"></script>
        <script src="websockets-doom.js"></script>
    </body>
</html>
