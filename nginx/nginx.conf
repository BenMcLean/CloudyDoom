worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # nginx:1.27's bundled mime.types already maps .wasm -> application/wasm.
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/wasm;

    server {
        listen 8080;

        root /usr/share/nginx/html;

        auth_basic           "doom.example.com";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # config.json is regenerated per-container-start from env vars;
        # never let it be cached by the browser.
        location = /config.json {
            add_header Cache-Control "no-store";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
